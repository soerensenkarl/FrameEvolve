[project]
name = "frameevolve"
version = "0.1.0"
description = "Evolving timber framing grammars with an LLM proposer and a deterministic verifier"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.5.0",
    "claude-agent-sdk>=0.2",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
