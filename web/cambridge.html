<!doctype html><meta charset="utf-8"><title>Cambridge houses</title>
<style>
 body{margin:0;font:14px system-ui;background:#f4f1ec;color:#222;overflow:hidden}
 #bar{position:fixed;top:0;left:0;right:0;padding:8px 14px;background:#fffd;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:1}
 select,button{font:inherit;padding:4px 9px} button.on{background:#333;color:#fff} #info{color:#555;flex-basis:100%}
</style>
<div id="bar"><button id="prev">&larr;</button><select id="pick"></select><button id="next">&rarr;</button>
 <button id="raw">City model</button><button id="det" class="on">Detailed</button>
 <button id="roofs" class="on">Roofs</button><button id="floors" class="on">Floors</button><button id="outer" class="on">Outside walls</button><button id="inner" class="on">Inside walls</button>
 <span id="info"></span></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
const H = /*DATA*/;
const scene = new THREE.Scene(); scene.background = new THREE.Color("#f4f1ec");
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 10, 30000); cam.up.set(0, 0, 1);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(devicePixelRatio); r.setSize(innerWidth, innerHeight); document.body.append(r.domElement);
const ctl = new OrbitControls(cam, r.domElement);
scene.add(new THREE.HemisphereLight("#ffffff", "#b9b2a6", 1.7)); const sun = new THREE.DirectionalLight("#fff", 1.3); sun.position.set(-600, -900, 1200); scene.add(sun);
const COL = { wall: "#efe9de", interior: "#cfd9e2", roof: "#b98f6a", floor: "#d9c9a8", ceiling: "#e9e4da" };
const show = { raw: false, det: true, roofs: true, floors: true, outer: true, inner: true };
let groups = {};
const off = { polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, side: THREE.DoubleSide };
function edged(g, color, opacity = 1) {
  const o = new THREE.Group();
  o.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color, ...off, transparent: opacity < 1, opacity })));
  o.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 1), new THREE.LineBasicMaterial({ color: "#4a4038" })));
  return o;
}
function surface(s) {
  const shape = new THREE.Shape(s.outline.map(([u, v]) => new THREE.Vector2(u, v)));
  for (const [, u0, v0, u1, v1] of s.openings) shape.holes.push(new THREE.Path([[u0, v0], [u1, v0], [u1, v1], [u0, v1]].map(([u, v]) => new THREE.Vector2(u, v))));
  const g = new THREE.ShapeGeometry(shape);
  const U = new THREE.Vector3(...s.u), V = new THREE.Vector3(...s.v), m = new THREE.Matrix4().makeBasis(U, V, new THREE.Vector3().crossVectors(U, V));
  m.setPosition(...s.o); g.applyMatrix4(m);
  const o = edged(g, s.kind === "wall" ? (s.role === "interior" ? COL.interior : COL.wall) : COL[s.kind]);
  for (const [kind, u0, v0, u1, v1] of s.openings) if (kind === "window") {
    const pane = new THREE.ShapeGeometry(new THREE.Shape([[u0, v0], [u1, v0], [u1, v1], [u0, v1]].map(([u, v]) => new THREE.Vector2(u, v)))); pane.applyMatrix4(m);
    o.add(new THREE.Mesh(pane, new THREE.MeshBasicMaterial({ color: "#7fb2d9", transparent: true, opacity: 0.55, side: THREE.DoubleSide })));
  }
  return o;
}
function load(i) {
  for (const g of Object.values(groups)) scene.remove(g);
  const h = H[i]; groups = { raw: new THREE.Group(), roofs: new THREE.Group(), floors: new THREE.Group(), outer: new THREE.Group(), inner: new THREE.Group() };
  if (h.raw) {
    const pos = []; for (const k of h.raw.f) pos.push(h.raw.v[3 * k], h.raw.v[3 * k + 1], h.raw.v[3 * k + 2]);
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
    groups.raw.add(edged(g, "#9aa7b5", 0.55));
  }
  for (const s of h.surfaces || []) {
    const o = surface(s); o.position.z = h.lift;
    groups[s.kind === "roof" ? "roofs" : s.kind === "wall" ? (s.role === "interior" ? "inner" : "outer") : "floors"].add(o);
  }
  for (const g of Object.values(groups)) scene.add(g);
  const box = new THREE.Box3().setFromObject(h.raw ? groups.raw : groups.outer), c = box.getCenter(new THREE.Vector3()), d = box.getSize(new THREE.Vector3()).length();
  ctl.target.copy(c); cam.position.set(c.x + d * 0.9, c.y - d * 1.1, c.z + d * 0.8);
  document.getElementById("info").textContent = h.info; pick.value = i; apply();
}
function apply() {
  groups.raw.visible = show.raw;
  for (const k of ["roofs", "floors", "outer", "inner"]) groups[k].visible = show.det && show[k];
  for (const k of Object.keys(show)) document.getElementById(k).classList.toggle("on", show[k]);
}
const pick = document.getElementById("pick");
H.forEach((h, i) => pick.add(new Option(h.name, i)));
pick.onchange = () => load(+pick.value);
for (const k of Object.keys(show)) document.getElementById(k).onclick = () => { show[k] = !show[k]; apply(); };
const step = (n) => load((+pick.value + n + H.length) % H.length);
document.getElementById("prev").onclick = () => step(-1); document.getElementById("next").onclick = () => step(1);
addEventListener("keydown", (e) => { if (e.key === "ArrowRight") step(1); if (e.key === "ArrowLeft") step(-1); });
addEventListener("resize", () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
load(0);
(function loop() { ctl.update(); r.render(scene, cam); requestAnimationFrame(loop); })();
</script>
